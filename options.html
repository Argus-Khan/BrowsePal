<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Browser Agent Bridge — Options</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <header>
    <h1>Browser Agent Bridge</h1>
    <p class="lead">Wire an external AI agent to this browser over a local WebSocket (JSON-RPC 2.0).</p>
  </header>

  <main>
    <label for="url">WebSocket URL</label>
    <input id="url" type="text" placeholder="ws://localhost:9222" />
    <small>The agent runs a WebSocket server here. The extension connects out to it.</small>

    <label for="token">Token (optional, light auth)</label>
    <input id="token" type="text" placeholder="shared secret — sent as the WS subprotocol" />

    <label class="row"><input id="autoReconnect" type="checkbox" checked /> Re-connect automatically</label>

    <button id="save">Save &amp; reconnect</button>
    <button id="status" class="ghost">Status</button>

    <pre id="out" hidden></pre>
  </main>

  <script src="options.js"></script>
</body>
</html>
