<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --ink: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
      --orange: #d29922;
      --border: #30363d;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      width: 340px;
      background: var(--bg);
      color: var(--ink);
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
    }
    .header-icon {
      width: 28px; height: 28px; border-radius: 6px;
      background: var(--accent); display: flex; align-items: center; justify-content: center;
      font-size: 15px; color: white; font-weight: 700;
    }
    .header h1 { font-size: 14px; font-weight: 600; flex: 1; }
    .header .pill {
      font-size: 11px; padding: 2px 8px; border-radius: 10px;
      font-weight: 500;
    }
    .pill.on { background: rgba(63,185,80,0.15); color: var(--green); }
    .pill.off { background: rgba(248,81,73,0.15); color: var(--red); }
    .section { padding: 10px 16px; border-bottom: 1px solid var(--border); }
    .section:last-of-type { border-bottom: none; }
    .row { display: flex; align-items: center; justify-content: space-between; }
    .label { font-size: 13px; }
    .label small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
    .toggle {
      position: relative; width: 36px; height: 20px; cursor: pointer; flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider {
      position: absolute; inset: 0; background: var(--border); border-radius: 10px;
      transition: background 0.2s;
    }
    .toggle .slider::before {
      content: ""; position: absolute; width: 16px; height: 16px; left: 2px; bottom: 2px;
      background: white; border-radius: 50%; transition: transform 0.2s;
    }
    .toggle input:checked + .slider { background: var(--accent); }
    .toggle input:checked + .slider::before { transform: translateX(16px); }
    .btn {
      display: block; width: 100%; padding: 6px 10px; margin-top: 6px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--surface); color: var(--ink);
      font: inherit; font-size: 12px; cursor: pointer; text-align: center;
      transition: border-color 0.15s;
    }
    .btn:hover { border-color: var(--muted); }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-success { border-color: var(--green); color: var(--green); }
    .btn-success:hover { background: rgba(63,185,80,0.1); }
    .btn-danger { border-color: var(--red); color: var(--red); }
    .btn-danger:hover { background: rgba(248,81,73,0.1); }
    .excluded-list { margin-top: 6px; }
    .excluded-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 8px; border: 1px solid var(--border); border-radius: 4px;
      margin-bottom: 4px; font-size: 12px; background: var(--surface);
    }
    .excluded-item .remove {
      cursor: pointer; color: var(--muted); padding: 0 4px; font-size: 14px; line-height: 1;
      transition: color 0.15s;
    }
    .excluded-item .remove:hover { color: var(--red); }
    .empty-hint { color: var(--muted); font-size: 11px; text-align: center; padding: 6px 0; }
    .footer {
      display: flex; gap: 0;
      border-top: 1px solid var(--border);
    }
    .footer button {
      flex: 1; padding: 9px; border: none; background: transparent;
      color: var(--muted); font: inherit; font-size: 11px; cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }
    .footer button:hover { color: var(--ink); background: var(--surface); }
    .footer button + button { border-left: 1px solid var(--border); }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">B</div>
    <h1>Browser Agent Bridge</h1>
    <span class="pill" id="statusPill">enabled</span>
  </div>

  <div class="section">
    <div class="row">
      <div class="label">
        Allow agent access
        <small>Disable to block all agent actions</small>
      </div>
      <label class="toggle">
        <input type="checkbox" id="enabledToggle" />
        <span class="slider"></span>
      </label>
    </div>
    <button class="btn" id="excludeCurrent" style="display:none">Block this site</button>
    <button class="btn btn-success" id="allowCurrent" style="display:none">Unblock this site</button>
  </div>

  <div class="section">
    <div class="label" style="margin-bottom:4px">Blocked sites</div>
    <div id="excludedList"></div>
    <div class="empty-hint" id="emptyHint">No sites blocked</div>
  </div>

  <div class="footer">
    <button id="openOptions">Settings</button>
    <button id="openSite">Open tab</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
