<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --bg: #0e1116;
      --panel: #161b22;
      --ink: #e6edf3;
      --muted: #8b97a4;
      --accent: #2f81f7;
      --red: #f85149;
      --green: #3fb950;
      --border: #30363d;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      width: 320px;
      padding: 12px;
      background: var(--bg);
      color: var(--ink);
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-size: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .status-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted);
    }
    .status-dot.enabled { background: var(--green); }
    .status-dot.disabled { background: var(--red); }
    .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
    .toggle {
      position: relative; width: 36px; height: 20px; cursor: pointer;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider {
      position: absolute; inset: 0; background: var(--border); border-radius: 10px; transition: 0.2s;
    }
    .toggle .slider::before {
      content: ""; position: absolute; width: 16px; height: 16px; left: 2px; bottom: 2px;
      background: white; border-radius: 50%; transition: 0.2s;
    }
    .toggle input:checked + .slider { background: var(--accent); }
    .toggle input:checked + .slider::before { transform: translateX(16px); }
    button {
      width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--panel); color: var(--ink); font: inherit; cursor: pointer;
    }
    button:hover { border-color: var(--muted); }
    .excluded-list { margin-top: 8px; }
    .excluded-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 4px;
      font-size: 12px;
    }
    .excluded-item .remove {
      cursor: pointer; color: var(--muted); padding: 0 4px; font-size: 14px; line-height: 1;
    }
    .excluded-item .remove:hover { color: var(--red); }
    .empty-hint { color: var(--muted); font-size: 11px; text-align: center; padding: 8px 0; }
    .footer { margin-top: 10px; display: flex; gap: 6px; }
    .footer button.link { background: none; border: none; color: var(--muted); font-size: 11px; cursor: pointer; text-decoration: none; padding: 0; width: auto; }
    .footer button.link:hover { color: var(--ink); }
    .current-site { display: flex; gap: 6px; margin-bottom: 6px; }
    .current-site button { flex: 1; }
  </style>
</head>
<body>
  <h1><span class="status-dot" id="statusDot"></span> Browser Agent Bridge</h1>

  <div class="row">
    <span>Allow agent access</span>
    <label class="toggle">
      <input type="checkbox" id="enabledToggle" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="current-site">
    <button id="excludeCurrent">Exclude this site</button>
    <button id="allowCurrent">Allow this site</button>
  </div>

  <div id="excludedSection">
    <div id="excludedList"></div>
    <div class="empty-hint" id="emptyHint">No excluded sites</div>
  </div>

  <div class="footer">
    <button id="openOptions" class="link">Advanced options</button>
    <button id="openSite" class="link">Open current site</button>
    <span style="flex:1"></span>
    <span id="statusText" style="color:var(--muted);font-size:11px"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
